<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Urban Farmers</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: #85bd89;">

  <!-- Navigation Placeholder -->
  <div id="nav-placeholder"></div>

  <!-- Main Content -->
  <section class="container mt-5">
    <h1>Welcome to Local Urban Farmers</h1>
    <p>Explore our services, gallery, and blog to learn more about urban farming.</p>
  </section>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- JavaScript to Load Navigation and Footer -->
  <script>
    // Dynamically load the navigation
    fetch("nav.html")
      .then(res => {
        if (!res.ok) {
          throw new Error("Failed to load navigation.");
        }
        return res.text();
      })
      .then(data => {
        document.getElementById("nav-placeholder").innerHTML = data;
      })
      .catch(error => console.error("Error loading navigation:", error));

    // Dynamically load the footer
    fetch("footer.html")
      .then(res => {
        if (!res.ok) {
          throw new Error("Failed to load footer.");
        }
        return res.text();
      })
      .then(data => {
        document.getElementById("footer-placeholder").innerHTML = data;
      })
      .catch(error => console.error("Error loading footer:", error));
  </script>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
